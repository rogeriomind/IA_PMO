services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-pmo_agent}
      POSTGRES_USER: ${POSTGRES_USER:-pmo_agent}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD}
    volumes:
      - pmo_agent_postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-pmo_agent} -d ${POSTGRES_DB:-pmo_agent}"]
      interval: 5s
      timeout: 5s
      retries: 10
    networks:
      - pmo_internal
    restart: unless-stopped

  redis:
    image: redis:7-alpine
    networks:
      - pmo_internal
    restart: unless-stopped

  pmo-ai-agent-api:
    build: .
    env_file:
      - .env
    environment:
      DATABASE_URL: postgresql+psycopg://${POSTGRES_USER:-pmo_agent}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB:-pmo_agent}
      REDIS_ENABLED: "true"
      REDIS_URL: redis://redis:6379/0
      MULTI_TENANT_ENABLED: "true"
    ports:
      - "${AGENT_API_PORT:-8010}:8010"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_started
    networks:
      - pmo_internal
    volumes:
      - /opt/shared/mcp:/opt/shared/mcp:ro
      - /opt/board_pmo:/opt/board_pmo:ro
      - /var/run/docker.sock:/var/run/docker.sock
      - /usr/bin/docker:/usr/bin/docker:ro
    healthcheck:
      test: ["CMD-SHELL", "python -c \"import urllib.request; urllib.request.urlopen('http://localhost:8010/health')\""]
      interval: 30s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  ia-pmo-admin-web:
    container_name: ia-pmo-admin-web
    build:
      context: ./admin-web
      dockerfile: Dockerfile
      args:
        VITE_API_BASE_URL: /api
        VITE_USE_MOCK_API: "false"
    expose:
      - "80"
    depends_on:
      pmo-ai-agent-api:
        condition: service_healthy
    networks:
      - pmo_internal
    restart: unless-stopped

volumes:
  pmo_agent_postgres:

networks:
  pmo_internal:
    driver: bridge
