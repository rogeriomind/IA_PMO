name: Deploy VPS

on:
  push:
    branches:
      - main
  workflow_dispatch:

concurrency:
  group: deploy-vps
  cancel-in-progress: false

jobs:
  tests:
    name: tests
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev]"

      - name: Run tests
        run: |
          python -m pytest

  deploy:
    name: deploy
    runs-on: ubuntu-latest
    needs:
      - tests
    if: github.ref == 'refs/heads/main'

    env:
      VPS_HOST: ${{ secrets.VPS_HOST }}
      VPS_USER: ${{ secrets.VPS_USER }}
      VPS_PORT: ${{ secrets.VPS_PORT }}
      VPS_SSH_KEY: ${{ secrets.VPS_SSH_KEY }}
      VPS_APP_DIR: ${{ secrets.VPS_APP_DIR }}
      VPS_AGENT_PORT: ${{ secrets.VPS_AGENT_PORT }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Validate deploy secrets
        shell: bash
        run: |
          missing=0
          for name in VPS_HOST VPS_USER VPS_SSH_KEY; do
            if [ -z "${!name}" ]; then
              echo "::error::$name is required"
              missing=1
            fi
          done
          exit "$missing"

      - name: Install deploy tools
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends rsync openssh-client

      - name: Configure SSH
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p ~/.ssh
          chmod 700 ~/.ssh
          printf '%s\n' "$VPS_SSH_KEY" > ~/.ssh/vps_deploy_key
          chmod 600 ~/.ssh/vps_deploy_key
          ssh-keyscan -p "${VPS_PORT:-22}" "$VPS_HOST" >> ~/.ssh/known_hosts

      - name: Upload release archive
        shell: bash
        run: |
          set -euo pipefail
          archive="/tmp/pmo-ai-agent-api-${GITHUB_SHA}.tar.gz"
          tar \
            --exclude='.git' \
            --exclude='.venv' \
            --exclude='.pytest_cache' \
            --exclude='__pycache__' \
            -czf "$archive" .
          scp \
            -i ~/.ssh/vps_deploy_key \
            -P "${VPS_PORT:-22}" \
            "$archive" \
            "${VPS_USER}@${VPS_HOST}:/tmp/pmo-ai-agent-api-${GITHUB_SHA}.tar.gz"

      - name: Deploy on VPS
        shell: bash
        run: |
          set -euo pipefail
          app_dir="${VPS_APP_DIR:-/opt/pmo-ai-agent-api}"
          agent_port="${VPS_AGENT_PORT:-8010}"
          ssh \
            -i ~/.ssh/vps_deploy_key \
            -p "${VPS_PORT:-22}" \
            "${VPS_USER}@${VPS_HOST}" \
            "APP_DIR='$app_dir' AGENT_PORT='$agent_port' GITHUB_SHA='$GITHUB_SHA' LANGFUSE_PUBLIC_URL='http://${VPS_HOST}:3000' bash -s" <<'REMOTE'
          set -euo pipefail

          archive="/tmp/pmo-ai-agent-api-${GITHUB_SHA}.tar.gz"
          release_dir="/tmp/pmo-ai-agent-api-release-${GITHUB_SHA}"
          backup="/opt/pmo-ai-agent-api-backup-$(date +%Y%m%d%H%M%S).tar.gz"

          if [ ! -f /opt/shared/mcp/board_pmo.md ]; then
            echo "Missing /opt/shared/mcp/board_pmo.md"
            exit 1
          fi

          rm -rf "$release_dir"
          mkdir -p "$release_dir"
          tar -xzf "$archive" -C "$release_dir"

          if [ -d "$APP_DIR" ]; then
            tar -czf "$backup" -C "$(dirname "$APP_DIR")" "$(basename "$APP_DIR")"
            echo "Backup created at $backup"
          else
            mkdir -p "$APP_DIR"
          fi

          rsync -a --delete \
            --exclude='.env' \
            --exclude='.env.txt' \
            --exclude='*.db' \
            --exclude='*.sqlite' \
            --exclude='*.sqlite3' \
            "$release_dir/" "$APP_DIR/"

          cd "$APP_DIR"
          touch .env

          ensure_env_var() {
            name="$1"
            value="$2"
            if ! grep -q "^${name}=" .env; then
              printf '\n%s=%s\n' "$name" "$value" >> .env
            fi
          }

          random_base64() {
            openssl rand -base64 32 | tr -d '\n'
          }

          random_hex() {
            openssl rand -hex 32 | tr -d '\n'
          }

          random_token() {
            openssl rand -hex 16 | tr -d '\n'
          }

          ensure_env_var LANGFUSE_ENABLED true
          ensure_env_var LANGFUSE_HOST http://langfuse-web:3000
          ensure_env_var LANGFUSE_WEB_PORT 3000
          ensure_env_var LANGFUSE_NEXTAUTH_URL "${LANGFUSE_PUBLIC_URL:-http://localhost:3000}"
          ensure_env_var LANGFUSE_NEXTAUTH_SECRET "$(random_base64)"
          ensure_env_var LANGFUSE_SALT "$(random_base64)"
          ensure_env_var LANGFUSE_ENCRYPTION_KEY "$(random_hex)"
          ensure_env_var LANGFUSE_POSTGRES_PASSWORD "$(random_base64)"
          ensure_env_var LANGFUSE_CLICKHOUSE_PASSWORD "$(random_base64)"
          ensure_env_var LANGFUSE_REDIS_AUTH "$(random_base64)"
          ensure_env_var LANGFUSE_MINIO_ROOT_USER "langfuse$(random_token)"
          ensure_env_var LANGFUSE_MINIO_ROOT_PASSWORD "$(random_base64)"
          ensure_env_var LANGFUSE_INIT_ORG_ID pmo-agent
          ensure_env_var LANGFUSE_INIT_ORG_NAME PMO-Agent
          ensure_env_var LANGFUSE_INIT_PROJECT_ID pmo-agent-api
          ensure_env_var LANGFUSE_INIT_PROJECT_NAME PMO-Agent-API
          ensure_env_var LANGFUSE_INIT_PROJECT_PUBLIC_KEY "lf_pk_$(random_token)"
          ensure_env_var LANGFUSE_INIT_PROJECT_SECRET_KEY "lf_sk_$(random_token)"
          ensure_env_var LANGFUSE_INIT_USER_EMAIL admin@pmo-agent.local
          ensure_env_var LANGFUSE_INIT_USER_NAME PMO-Admin
          ensure_env_var LANGFUSE_INIT_USER_PASSWORD "$(random_base64)"

          docker compose build
          docker compose up -d

          for _ in $(seq 1 24); do
            if curl -fsS "http://localhost:${AGENT_PORT}/health" >/tmp/pmo-agent-health.json; then
              cat /tmp/pmo-agent-health.json
              break
            fi
            sleep 5
          done

          curl -fsS "http://localhost:${AGENT_PORT}/ready"
          curl -fsS "http://localhost:${LANGFUSE_WEB_PORT:-3000}/api/public/health" || true
          docker compose ps
          rm -rf "$release_dir" "$archive"
          REMOTE
