name: CI

on:
  pull_request:
    branches:
      - main
  push:
    branches:
      - main

jobs:
  tests:
    name: tests
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev]"

      - name: Run tests
        run: |
          python -m pytest

      - name: Compile Python modules
        run: |
          python -m compileall app examples tests

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: admin-web/package-lock.json

      - name: Install frontend dependencies
        working-directory: admin-web
        run: npm ci

      - name: Lint frontend
        working-directory: admin-web
        run: npm run lint

      - name: Typecheck frontend
        working-directory: admin-web
        run: npm run typecheck

      - name: Test frontend
        working-directory: admin-web
        run: npm run test

      - name: Build frontend
        working-directory: admin-web
        run: npm run build

