services:
  postgres:
    image: postgres:16
    container_name: pmo-ai-agent-postgres
    environment:
      POSTGRES_DB: pmo_agent
      POSTGRES_USER: pmo_agent
      POSTGRES_PASSWORD: pmo_agent
    volumes:
      - pmo_agent_postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U pmo_agent -d pmo_agent"]
      interval: 5s
      timeout: 5s
      retries: 10
    networks:
      - pmo_internal
    restart: unless-stopped

  redis:
    image: redis:7-alpine
    container_name: pmo-ai-agent-redis
    profiles:
      - redis
    networks:
      - pmo_internal
    restart: unless-stopped

  pmo-ai-agent-api:
    build: .
    container_name: pmo-ai-agent-api
    env_file:
      - .env
    ports:
      - "${AGENT_API_PORT:-8010}:8010"
    depends_on:
      postgres:
        condition: service_healthy
    volumes:
      - /opt/shared/mcp:/opt/shared/mcp:ro
      - /opt/board_pmo:/opt/board_pmo:ro
      - /var/run/docker.sock:/var/run/docker.sock
      - /usr/bin/docker:/usr/bin/docker:ro
    networks:
      - pmo_internal
      - board_pmo_default
    restart: unless-stopped

networks:
  pmo_internal:
    driver: bridge
  board_pmo_default:
    external: true

volumes:
  pmo_agent_postgres:
