services:
  pmo-ai-agent-api:
    build: .
    container_name: pmo-ai-agent-api
    env_file:
      - .env
    ports:
      - "${AGENT_API_PORT:-8010}:8010"
    volumes:
      - /opt/shared/mcp:/opt/shared/mcp:ro
      - /opt/board_pmo:/opt/board_pmo:ro
      - /var/run/docker.sock:/var/run/docker.sock
      - /usr/bin/docker:/usr/bin/docker:ro
    networks:
      - pmo_internal
      - board_pmo_default
    restart: unless-stopped

networks:
  pmo_internal:
    driver: bridge
  board_pmo_default:
    external: true
